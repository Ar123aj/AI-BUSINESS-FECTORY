<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activation Form</title>
  <style>
    body {
      background-color: #121212;
      color: #1de9b6;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    form {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(29, 233, 182, 0.3);
      width: 90%;
      max-width: 1000px;
    }
    input {
      flex: 1;
      min-width: 150px;
      padding: 10px;
      border: none;
      border-radius: 5px;
      background-color: #2c2c2c;
      color: #fff;
    }
    input::placeholder {
      color: #aaa;
    }
    button {
      background-color: #1de9b6;
      color: #121212;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      padding: 10px 20px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #00bfa5;
    }
  </style>
</head>
<body>
  <form id="activationForm" action="https://script.google.com/macros/s/AKfycbwj_llvwVzL_eOLb0-eSC5ms-wPZJIOI2RlT-NYxYJVB9K-GSYOpkPh3u1F22-EimIg/exec" method="POST">
    <input type="text" name="agent_name" placeholder="Service Name" required>
    <input type="text" name="name" placeholder="Your Name" required>
    <input type="email" name="email" placeholder="Email Address" required>
    <input type="text" name="order_id" placeholder="Order ID" required>
    <input type="url" name="website_url" placeholder="Website URL" required>
    <input type="text" name="status" placeholder="Status" required>
    <button type="submit">Activate</button>
  </form>

  <script>
    document.getElementById("activationForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const form = e.target;
      try {
        await fetch(form.action, {
          method: "POST",
          body: new FormData(form)
        });
        window.location.href = "activation_success.html";
      } catch (err) {
        alert("Error submitting form: " + err);
      }
    });
  </script>
</body>
</html>
