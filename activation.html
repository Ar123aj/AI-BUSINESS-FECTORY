<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activate Your AI Agent</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 10px;
      width: 50%;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      text-align: center;
    }
    h2 {
      color: #00ffcc;
      margin-bottom: 20px;
    }
    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    label {
      align-self: flex-start;
      font-weight: bold;
      margin-left: 10%;
    }
    input {
      width: 80%;
      padding: 10px;
      background-color: #2c2c2c;
      color: #e0e0e0;
      border: none;
      border-radius: 5px;
    }
    button {
      width: 80%;
      padding: 10px;
      background-color: #00ffcc;
      color: #121212;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #00cc99;
    }
    @media(max-width:768px){
      .container{width:90%;}
      input,button{width:90%;}
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Activate Your AI Agent</h2>
    <form action="https://script.google.com/macros/s/AKfycbzz_PSuPIIpUy1tReAzW1ffCANkibIetmKlN78uPYbA9aXmamNuGlUQq5iTEwRWZJQR/exec" method="POST">
      <label>Agent Name:</label>
      <input type="text" name="agent_name" required>

      <label>Your Name:</label>
      <input type="text" name="name" required>

      <label>Your Email:</label>
      <input type="email" name="email" required>

      <label>Gumroad Order ID:</label>
      <input type="text" name="order_id" required>

      <label>Your Website URL:</label>
      <input type="url" name="website_url" required>

      <!-- Hidden status field (not visible to user) -->
      <input type="hidden" name="status" value="Working">

      <button type="submit">Activate Service</button>
    </form>
  </div>
</body>
</html>
