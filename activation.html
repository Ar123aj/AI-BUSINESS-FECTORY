<form id="activationForm" action="https://script.google.com/macros/s/AKfycbwj_llvwVzL_eOLb0-eSC5ms-wPZJIOI2RlT-NYxYJVB9K-GSYOpkPh3u1F22-EimIg/exec" method="POST">
  <input type="text" name="agent_name" placeholder="Agent Name" required>
  <input type="text" name="name" placeholder="Your Name" required>
  <input type="email" name="email" placeholder="Email" required>
  <input type="text" name="order_id" placeholder="Order ID" required>
  <input type="url" name="website_url" placeholder="Website URL" required>
  <input type="text" name="status" placeholder="Status" required>
  <button type="submit">Activate</button>
</form>

<script>
  document.getElementById("activationForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const form = e.target;
    try {
      await fetch(form.action, {
        method: "POST",
        body: new FormData(form)
      });
      // ✅ Safe redirect from client side
      window.location.href = "https://ar123aj.github.io/AI-BUSINESS-FECTORY/activation_success.html";
    } catch (err) {
      alert("Error submitting form: " + err);
    }
  });
</script>
